[project]
name = "mj-viser"
version = "0.4.0"
description = "See MuJoCo simulations in your browser: live, as plans, or replayed"
license = "MIT"
authors = [
    {name = "Siddhartha Srinivasa", email = "siddhartha.srinivasa@gmail.com"},
]
maintainers = [
    {name = "Siddhartha Srinivasa", email = "siddhartha.srinivasa@gmail.com"},
]
requires-python = ">=3.11,<3.15"
keywords = ["mujoco", "robotics", "simulation", "visualization", "viser"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dynamic = ["readme"]
dependencies = [
    "mujoco>=3.12",
    "numpy>=1.24",
    "pillow>=9.2",
    "trimesh>=3.21.7",
    "viser>=1.1.1,<1.2",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme==25.1.0"]
build-backend = "hatchling.build"

[project.urls]
Homepage = "https://github.com/personalrobotics/mj_viser"
Repository = "https://github.com/personalrobotics/mj_viser"
Issues = "https://github.com/personalrobotics/mj_viser/issues"
Changelog = "https://github.com/personalrobotics/mj_viser/blob/main/CHANGELOG.md"
"Public API" = "https://github.com/personalrobotics/mj_viser/blob/main/docs/api.md"

# The README is the PyPI project description. PyPI resolves no relative paths and gives
# headings no anchors, so the build points them at the repository's main branch;
# scripts/check_readme.py checks the result.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src|srcset)="(?!https?://)([^"]+)"'
replacement = '\1="https://raw.githubusercontent.com/personalrobotics/mj_viser/main/\2"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\(#([^)]+)\)'
replacement = '](https://github.com/personalrobotics/mj_viser#\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/personalrobotics/mj_viser/blob/main/\1)'

[tool.hatch.build.targets.wheel]
packages = ["src/mj_viser"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"src/mj_viser/__init__.py" = ["F401"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
# MuJoCo ships no type stubs or py.typed marker.
module = ["mujoco", "mujoco.*"]
ignore_missing_imports = true
