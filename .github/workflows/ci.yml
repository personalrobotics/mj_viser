name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Nightly: the newest dependency releases on every Python, without waiting for a push.
  schedule:
    - cron: "0 7 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Third-party actions are pinned to commit SHAs (tag in the trailing comment).
jobs:
  # Gates, then build the sdist and the wheel (from the sdist) exactly once.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --locked --all-extras

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Strict type check
        run: uv run mypy src

      - name: Build sdist and wheel
        run: |
          uv build --out-dir dist
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Tests run against the uploaded wheel, not a rebuild. One job per (Python, environment)
  # so they run in parallel. Pull requests check the locked versions on every Python plus
  # the declared minimums and the newest releases; main, nightly, and manual runs also check
  # the newest releases on every Python.
  test:
    name: test (${{ matrix.python }}, ${{ matrix.env }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request' && '[
            {"python": "3.11", "env": "lowest"},
            {"python": "3.11", "env": "locked"},
            {"python": "3.12", "env": "locked"},
            {"python": "3.13", "env": "locked"},
            {"python": "3.14", "env": "locked"},
            {"python": "3.14", "env": "latest"}
          ]' || '[
            {"python": "3.11", "env": "lowest"},
            {"python": "3.11", "env": "locked"},
            {"python": "3.12", "env": "locked"},
            {"python": "3.13", "env": "locked"},
            {"python": "3.14", "env": "locked"},
            {"python": "3.11", "env": "latest"},
            {"python": "3.12", "env": "latest"},
            {"python": "3.13", "env": "latest"},
            {"python": "3.14", "env": "latest"}
          ]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Verify artifact hashes
        run: (cd dist && sha256sum -c SHA256SUMS)

      # Public robots from MuJoCo Menagerie, pinned to one commit: a textured arm with cameras
      # (trossen_wxai), a gripper with tendons (robotiq_2f85), and a legged robot (unitree_go1),
      # with sites in several groups between them.
      - name: Fetch robot fixtures
        run: |
          git init -q menagerie
          git -C menagerie remote add origin https://github.com/google-deepmind/mujoco_menagerie.git
          git -C menagerie sparse-checkout set trossen_wxai robotiq_2f85 unitree_go1
          git -C menagerie fetch -q --depth 1 --filter=blob:none origin feadf76d42f8a2162426f7d226a3b539556b3bf5
          git -C menagerie checkout -q FETCH_HEAD

      # Software OpenGL, so the texture check can compare against MuJoCo's renderer.
      - name: Install OSMesa
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libosmesa6

      - name: Clean-wheel end-to-end check
        env:
          MUJOCO_GL: osmesa
          MJ_VISER_REQUIRE_RENDER: "1"
        run: |
          robots=menagerie/trossen_wxai/scene.xml:menagerie/robotiq_2f85/scene.xml:menagerie/unitree_go1/scene.xml
          MJ_VISER_WHEEL="$(ls dist/mj_viser-*.whl)" MJ_VISER_ROBOT_XML=$robots scripts/smoke_wheel.sh e2e ${{ matrix.env }}
          cp dist/SHA256SUMS e2e/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-py${{ matrix.python }}-${{ matrix.env }}
          path: e2e/
          if-no-files-found: error

  # Live ssrobot view (#28) on the reference robots: ssrobot and the Geodude and ADA packages,
  # each pinned to a commit (the robots at the commits ssrobot itself pins in references/).
  ssrobot-live:
    name: ssrobot live view
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: "3.12"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Verify artifact hashes
        run: (cd dist && sha256sum -c SHA256SUMS)

      - name: Install the wheel, ssrobot, and the reference robots
        run: |
          uv venv --quiet .ssrobot
          uv pip install --quiet --python .ssrobot/bin/python "$(ls dist/mj_viser-*.whl)" \
            "ssrobot[mujoco] @ git+https://github.com/personalrobotics/ssrobot.git@583759f969753b1ba2b5bce306c52e7a35a54c41" \
            "geodude-assets @ git+https://github.com/personalrobotics/geodude_assets.git@30ca5ff8706e5d856fd22d2511c879026ee45bb3" \
            "ada-assets @ git+https://github.com/personalrobotics/ada_assets.git@66b2d12ffb70fe217c64c45691166fc43d1b203b"

      - name: Live view changes nothing
        run: |
          mkdir -p ssrobot-live && cd ssrobot-live
          ../.ssrobot/bin/python -I ../scripts/e2e/ssrobot_live.py .
          cat ssrobot_live.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ssrobot-live
          path: ssrobot-live/
          if-no-files-found: error

  # Legacy integration hook. It needs a token that is not configured, so it is skipped
  # rather than failing main until robot-code owns a replacement.
  notify-robot-code:
    needs: [test, ssrobot-live]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DISPATCH_TOKEN: ${{ secrets.ROBOT_CODE_DISPATCH_TOKEN }}
    steps:
      - name: Report missing token
        if: env.DISPATCH_TOKEN == ''
        run: echo "::notice::ROBOT_CODE_DISPATCH_TOKEN is not configured; skipping robot-code dispatch."

      - name: Dispatch integration run
        if: env.DISPATCH_TOKEN != ''
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3.0.0
        with:
          token: ${{ env.DISPATCH_TOKEN }}
          repository: personalrobotics/robot-code
          event-type: sibling-updated
          client-payload: '{"repo":"${{ github.event.repository.name }}","sha":"${{ github.sha }}"}'
